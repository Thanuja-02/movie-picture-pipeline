name: Frontend Continuous Deployment

on:
  workflow_run:
    workflows: ["Frontend Continuous Integration"]
    types:
      - completed

  # Manual trigger button
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: cluster
      ECR_FRONTEND_REPOSITORY: 160277814735.dkr.ecr.us-east-1.amazonaws.com/frontend

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run lint
      - name: Run lint
        run: npm run lint

      # Run tests
      - name: Run tests
        run: npm test -- --watchAll=false

      # Build frontend
      - name: Build frontend
        run: npm run build

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Install kubectl
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # Update kubeconfig
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # Verify cluster connection
      - name: Verify cluster
        run: kubectl get nodes

      # Deploy frontend
      - name: Deploy frontend
        run: |
          kubectl apply -f starter/frontend/k8s/frontend-deployment.yaml
          kubectl apply -f starter/frontend/k8s/frontend-service.yaml

          # Remove stuck terminating pods if any
          kubectl delete pod -l app=frontend --force --grace-period=0 || true

          # Restart deployment
          kubectl rollout restart deployment/frontend

          # Wait for successful rollout
          kubectl rollout status deployment/frontend --timeout=300s

      # Show deployment status
      - name: Show status
        run: |
          kubectl get pods -l app=frontend -o wide
          kubectl get svc frontend-service -o wide