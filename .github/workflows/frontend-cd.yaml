name: Frontend Continuous Deployment

on:
  workflow_run:
    workflows: ["Frontend Continuous Integration"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: cluster
      ECR_FRONTEND_REPOSITORY: 160277814735.dkr.ecr.us-east-1.amazonaws.com/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Verify cluster
        run: kubectl get nodes

      - name: Deploy frontend
        run: |
          kubectl apply -f starter/frontend/k8s/frontend-deployment.yaml
          kubectl apply -f starter/frontend/k8s/frontend-service.yaml

          kubectl delete pod -l app=frontend --force --grace-period=0 || true

          kubectl rollout restart deployment/frontend

          kubectl rollout status deployment/frontend --timeout=300s

      - name: Show status
        run: |
          kubectl get pods -l app=frontend -o wide
          kubectl get svc frontend-service -o wide