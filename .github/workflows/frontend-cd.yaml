name: Frontend Continuous Deployment

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watchAll=false

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t frontend ./starter/frontend

      - name: Verify Docker image
        run: docker images frontend

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # This step may fail in Vocareum, so we allow failure
      - name: Update kubeconfig
        id: kubeconfig
        continue-on-error: true
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      # Run only if kubeconfig succeeded
      - name: Verify cluster
        if: steps.kubeconfig.outcome == 'success'
        run: kubectl get nodes

      # Run only if kubeconfig succeeded
      - name: Deploy to EKS
        if: steps.kubeconfig.outcome == 'success'
        run: |
          kubectl apply -f starter/frontend/k8s/frontend-deployment.yaml
          kubectl apply -f starter/frontend/k8s/frontend-service.yaml

          # Remove any stuck frontend pods
          kubectl delete pod -l app=frontend --force --grace-period=0 || true

          # Restart deployment cleanly
          kubectl rollout restart deployment/frontend

          # Wait for rollout to complete
          kubectl rollout status deployment/frontend --timeout=300s

      # Run when EKS access is denied
      - name: Skip deployment when EKS access is denied
        if: steps.kubeconfig.outcome != 'success'
        run: |
          echo "EKS deployment skipped because Vocareum blocks eks:DescribeCluster in GitHub Actions."
          echo "Lint, Test, and Build completed successfully."